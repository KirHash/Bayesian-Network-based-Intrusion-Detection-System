# Netlify hosts only the dashboard's pages. The Python backend (serve.py) runs elsewhere
# and is reached at VITE_API_URL, which you set in Netlify: Site configuration ->
# Environment variables, e.g. VITE_API_URL=https://ids.example.com
# On the backend set IDS_CORS_ORIGINS=https://<your-site>.netlify.app

[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=31536000"
    # connect-src lets the page talk to the backend; narrow "https: wss:" to your backend's origin
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https: wss:; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
