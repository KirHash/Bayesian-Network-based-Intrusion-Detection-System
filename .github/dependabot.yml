# Weekly pull requests for new versions, so security fixes are not missed.
version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /deploy/server
    schedule:
      interval: weekly
