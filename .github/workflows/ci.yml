name: CI

# Every push and pull request: the backend tests, the dashboard's tests and build, dependency audits,
# and a build of the Docker image. The CIC-IDS datasets are not in the repository, so the tests that
# need them are skipped here (they run on a machine that has the files).
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Test
        run: python -m pytest -q -m "not slow"

  frontend:
    name: Dashboard tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages
        run: |
          pip install pip-audit
          pip-audit -r requirements-prod.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Dashboard packages
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=moderate

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Sensor image (with packet capture rights)
        run: docker build -f deploy/docker/Dockerfile -t bayesian-ids .

      - name: Server stack
        working-directory: deploy/server
        env:
          IDS_DOMAIN: ci.example.com
        run: |
          docker compose config -q
          docker compose build
