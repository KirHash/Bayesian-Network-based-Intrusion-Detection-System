# docker compose -f deploy/docker/docker-compose.yml up -d --build
#
# First account (the server refuses to listen publicly without one):
#   docker compose -f deploy/docker/docker-compose.yml run --rm ids \
#       python manage_users.py add alice --role admin
services:
  ids:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped

    # Live capture sees the host's network only with host networking, which
    # exists on Linux only. On Docker Desktop (Windows / macOS) remove
    # network_mode and the ports are mapped instead; capture then sees the
    # container's own traffic, so use pcap / API input there.
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN

    environment:
      IDS_ADMIN_TOKEN: ${IDS_ADMIN_TOKEN:-}
      IDS_API_KEY: ${IDS_API_KEY:-}
      # Notifications: copy your notify.json into the data volume
      # (docker compose cp notify.json ids:/data/notify.json), then reload it
      # from the dashboard.
      IDS_NOTIFY_CONFIG: /data/notify.json
    volumes:
      - ids-data:/data

volumes:
  ids-data:
