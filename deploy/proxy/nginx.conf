# nginx in front of the server. Obtain certificates with certbot or bring your own.
#
# Start the server with:  python serve.py --host 127.0.0.1 --behind-proxy

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name ids.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_tokens off;
    server_name ids.example.com;

    ssl_certificate     /etc/letsencrypt/live/ids.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ids.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Dashboard uploads (datasets, pcaps) stream through here and can be
    # several GB. Keep this at least as large as IDS_MAX_UPLOAD_MB (default
    # 4096). Streaming the body through, not buffering it to disk first,
    # keeps both memory and disk use flat.
    client_max_body_size 4g;
    proxy_request_buffering off;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # overwrite, never append: the dashboard must see the real client address
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # the live dashboard feed is a WebSocket
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
